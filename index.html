<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; img-src 'self' data:; connect-src 'none'"><title>AG Wli Offline Church Manager</title><style>
:root{--navy:#14213d;--blue:#244b83;--gold:#d5a642;--bg:#f4f6fa;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;font:15px Segoe UI,Arial,sans-serif;background:var(--bg);color:#1e293b}.app{display:flex;min-height:100vh}.side{width:235px;background:var(--navy);color:white;padding:18px 13px;flex-shrink:0}.brand{padding:10px;border-bottom:1px solid #ffffff30;margin-bottom:14px}.logo{background:var(--gold);color:var(--navy);padding:9px 11px;border-radius:9px;display:inline-block;font-weight:800}.brand h3{font-size:17px;margin:10px 0 4px}.brand small{color:#cbd5e1}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#e2e8f0;text-align:left;padding:11px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff20}.sidefoot{font-size:11px;color:#cbd5e1;line-height:1.5;padding:18px 8px}.main{flex:1;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;background:white;border-bottom:1px solid var(--line);padding:18px 25px}.top h2{margin:0;font-size:21px}.pill{background:#e6f8ed;color:#16794b;border-radius:20px;padding:8px 11px;font-size:12px;white-space:nowrap}.updatebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.update-status{font-size:12px;color:#64748b;max-width:300px}.content{padding:23px;max-width:1450px;margin:auto}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.head h2{margin:0}.muted{color:#64748b;font-size:13px;margin-top:5px}.btn{border:0;padding:10px 14px;border-radius:8px;font-weight:600;cursor:pointer}.primary{background:var(--blue);color:white}.soft{background:#e9eef6;color:var(--navy)}.red{background:#fee2e2;color:#b91c1c}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:17px}.card small{color:#64748b}.num{font-size:25px;font-weight:750;margin-top:8px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel h3{margin:0 0 14px;font-size:16px}.quick{display:flex;flex-wrap:wrap;gap:8px}.quick button{padding:11px;border:1px solid var(--line);background:white;border-radius:8px;cursor:pointer;color:var(--navy)}.notice{padding:12px 14px;border-radius:8px;background:#fff6db;color:#79530a;margin-bottom:15px;line-height:1.5}.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;background:white;font:inherit;color:#1e293b}.row input{max-width:360px}label{display:block;font-size:12px;font-weight:650;margin-bottom:5px;color:#475569}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:white}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{background:#f8fafc;color:#475569;text-transform:uppercase;font-size:11px}td button{margin-right:4px;padding:5px 8px;border:0;border-radius:5px;cursor:pointer;background:#e9eef6}td button.del{color:#b91c1c;background:#fee2e2}.empty{padding:26px;text-align:center;color:#64748b}.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.box{background:white;width:min(700px,100%);max-height:90vh;overflow:auto;padding:22px;border-radius:13px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields .full{grid-column:1/-1}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.report{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:15px;line-height:1.7}.footer{color:#64748b;font-size:12px;line-height:1.5;margin-top:15px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.side{width:190px}}@media(max-width:650px){.app{display:block}.side{width:100%;padding:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidefoot{display:none}.brand{padding:5px}.top{padding:14px}.content{padding:12px}.fields{grid-template-columns:1fr}.fields .full{grid-column:auto}.cards{gap:8px}.card{padding:12px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><span class="logo">✦ AG</span><h3>Assemblies of God, Wli</h3><small>Offline Church Manager</small></div><nav class="nav" id="nav"></nav><div class="sidefoot">Records stay on this computer. Export backups regularly, especially before changing devices.</div></aside><main class="main"><header class="top"><h2 id="topTitle">Dashboard</h2><div class="updatebar"><span class="pill">● Works offline</span><button class="btn soft" id="checkUpdatesBtn" type="button" onclick="checkForUpdates()">Check for updates</button><span class="update-status" id="updateStatus" aria-live="polite">Updates check when online</span></div></header><section class="content" id="content"></section></main></div><div class="modal" id="modal"><div class="box"><div class="head"><h2 id="formTitle">Add record</h2><button class="btn soft" onclick="closeForm()">Close</button></div><form id="form"><div class="fields" id="fields"></div><div class="foot"><button type="button" class="btn soft" onclick="closeForm()">Cancel</button><button class="btn primary">Save record</button></div></form></div></div><input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
const KEY='AGWliOfflineChurchManager_v1', defaults={church:{name:'Assemblies of God, Wli',pastor:'',phone:'',address:'Wli, Ghana',currency:'GHS'},members:[],attendance:[],finance:[],events:[],pastoral:[],payroll:[]};let db;try{db={...structuredClone(defaults),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){db=structuredClone(defaults)}let page='dashboard',formType='',editId=null;
const navs={dashboard:'▦ Dashboard',members:'♙ Members',attendance:'✓ Attendance',finance:'₵ Finance',events:'▣ Events',pastoral:'♡ Pastoral care',payroll:'▤ Payroll',reports:'▥ Reports & backup',settings:'⚙ Settings'};
const schemas={
members:{title:'Member',cols:[['name','Full name'],['memberId','Member ID'],['phone','Phone'],['gender','Gender'],['ministry','Ministry'],['status','Status']],fields:[['name','Full name','text',1],['memberId','Member ID','text'],['phone','Phone','tel'],['gender','Gender','select','Male|Female|Prefer not to say'],['dob','Date of birth','date'],['address','Address/community','text'],['ministry','Ministry/group','text'],['status','Membership status','select','Active|Visitor|Inactive'],['joined','Date joined','date'],['notes','Notes','textarea']]},
attendance:{title:'Attendance entry',cols:[['date','Date'],['service','Service'],['person','Member/visitor'],['count','Count'],['notes','Notes']],fields:[['date','Date','date',1],['service','Service','select','Sunday service|Midweek service|Prayer meeting|Youth service|Other'],['person','Member/visitor name','text',1],['count','People count','number'],['notes','Notes','text']]},
finance:{title:'Finance entry',cols:[['date','Date'],['kind','Type'],['category','Category'],['amount','Amount'],['party','From/paid to'],['method','Method']],fields:[['date','Date','date',1],['kind','Type','select','Offering|Tithe|Donation|Fundraising|Expense|Other income',1],['category','Category','text',1],['amount','Amount (GHS)','number',1],['party','Received from/paid to','text'],['method','Payment method','select','Cash|Mobile Money|Bank transfer|Cheque|Other'],['reference','Receipt/reference','text'],['notes','Notes','textarea']]},
events:{title:'Event',cols:[['title','Event'],['date','Date'],['time','Time'],['venue','Venue'],['status','Status']],fields:[['title','Event title','text',1],['date','Date','date',1],['time','Time','time'],['venue','Venue','text'],['organizer','Organizer/ministry','text'],['budget','Budget (GHS)','number'],['status','Status','select','Planned|Completed|Cancelled'],['notes','Details','textarea']]},
pastoral:{title:'Pastoral care record',cols:[['date','Date'],['person','Person'],['careType','Care type'],['assigned','Caregiver'],['followup','Follow-up'],['status','Status']],fields:[['date','Date','date',1],['person','Person/member','text',1],['careType','Care type','select','Counselling|Hospital visit|Home visit|Prayer request|Bereavement|Welfare support|Follow-up|Other'],['assigned','Pastor/caregiver','text'],['followup','Follow-up date','date'],['status','Status','select','Open|Follow-up needed|Closed'],['notes','Confidential notes','textarea']]},
payroll:{title:'Payroll record',cols:[['period','Pay period'],['staff','Staff'],['role','Role'],['basic','Basic pay'],['allowances','Allowances'],['deductions','Deductions'],['status','Status']],fields:[['period','Pay period','text',1],['staff','Staff/worker name','text',1],['role','Role','text'],['basic','Basic pay (GHS)','number',1],['allowances','Allowances (GHS)','number'],['deductions','Deductions (GHS)','number'],['paidOn','Payment date','date'],['status','Status','select','Pending|Paid'],['notes','Notes','text']]}};
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){return new Date().toISOString().slice(0,10)}function cash(n){return new Intl.NumberFormat('en-GH',{style:'currency',currency:db.church.currency||'GHS',maximumFractionDigits:2}).format(+n||0)}function income(){return db.finance.filter(x=>x.kind!=='Expense').reduce((s,x)=>s+(+x.amount||0),0)}function expenses(){return db.finance.filter(x=>x.kind==='Expense').reduce((s,x)=>s+(+x.amount||0),0)}function card(k,v){return `<div class="card"><small>${k}</small><div class="num">${v}</div></div>`}function head(t,d,b=''){return `<div class="head"><div><h2>${t}</h2><div class="muted">${d}</div></div>${b}</div>`}
function init(){document.getElementById('nav').innerHTML=Object.entries(navs).map(([k,v])=>`<button data-page="${k}">${v}</button>`).join('');document.getElementById('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)};document.getElementById('form').onsubmit=saveForm;document.getElementById('importFile').onchange=importBackup;render()}
function go(p){page=p;render()}function render(){document.getElementById('topTitle').textContent=navs[page].replace(/^[^ ]+ /,'');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let c=document.getElementById('content');if(page==='dashboard')c.innerHTML=dashboard();else if(schemas[page])c.innerHTML=tablePage(page);else if(page==='reports')c.innerHTML=reports();else c.innerHTML=settings()}
function dashboard(){let ev=db.events.filter(x=>x.date>=today()&&x.status!=='Cancelled').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);return `${head('Church overview','Local records for '+esc(db.church.name),'<button class="btn primary" onclick="go(\'members\');openForm(\'members\')">＋ Add member</button>')}<div class="notice">Offline mode is active. Records are saved on this computer only. Make a backup regularly.</div><div class="cards">${card('Registered members',db.members.length)}${card('Attendance records',db.attendance.length)}${card('Total income',cash(income()))}${card('Total expenses',cash(expenses()))}</div><div class="cols"><div class="panel"><h3>Quick actions</h3><div class="quick">${Object.keys(schemas).map(k=>`<button onclick="go('${k}');openForm('${k}')">＋ ${schemas[k].title}</button>`).join('')}</div><p class="footer">Use Reports & Backup to export a copy before changing computers.</p></div><div class="panel"><h3>Upcoming events</h3>${ev.length?ev.map(x=>`<p><b>${esc(x.title)}</b><br><span class="muted">${esc(x.date)} · ${esc(x.venue||'Venue not set')}</span></p>`).join(''):'<div class="empty">No upcoming events saved.</div>'}</div></div><div class="panel" style="margin-top:15px"><h3>Finance summary</h3>Income: <b>${cash(income())}</b> &nbsp; Expenses: <b>${cash(expenses())}</b> &nbsp; Balance: <b>${cash(income()-expenses())}</b></div>`}
function tablePage(type){let s=schemas[type],arr=db[type];let extra=type==='finance'?`<div class="cards">${card('Income',cash(income()))}${card('Expenses',cash(expenses()))}${card('Balance',cash(income()-expenses()))}${card('Entries',arr.length)}</div>`:type==='payroll'?`<div class="cards">${card('Net payroll',cash(arr.reduce((a,x)=>a+Math.max(0,(+x.basic||0)+(+x.allowances||0)-(+x.deductions||0)),0)))}${card('Pending',arr.filter(x=>x.status==='Pending').length)}${card('Paid',arr.filter(x=>x.status==='Paid').length)}${card('Records',arr.length)}</div>`:'';return `${head(s.title+'s','Add, search, edit and remove local records.',`<button class="btn primary" onclick="openForm('${type}')">＋ Add record</button>`)}${extra}<div class="row"><input id="search" placeholder="Search records..." oninput="searchRows(this.value)"><button class="btn soft" onclick="exportCSV('${type}')">Export CSV</button></div><div id="table">${tableHTML(type,arr)}</div>`}
function tableHTML(type,arr){let s=schemas[type];if(!arr.length)return '<div class="empty">No records saved yet. Select Add record to begin.</div>';return `<div class="tablewrap"><table><thead><tr>${s.cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${arr.map(x=>`<tr data-search="${esc(JSON.stringify(x).toLowerCase())}">${s.cols.map(([k])=>`<td>${['amount','basic','allowances','deductions','budget'].includes(k)?cash(x[k]):esc(x[k]||'—')}</td>`).join('')}<td><button onclick="openForm('${type}','${x.id}')">Edit</button><button class="del" onclick="deleteRecord('${type}','${x.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function searchRows(q){document.querySelectorAll('#table tbody tr').forEach(r=>r.style.display=r.dataset.search.includes(q.toLowerCase())?'':'none')}
function openForm(type,id=null){formType=type;editId=id;let rec=id?db[type].find(x=>x.id===id)||{}:{};document.getElementById('formTitle').textContent=(id?'Edit ':'Add ')+schemas[type].title;document.getElementById('fields').innerHTML=schemas[type].fields.map(f=>{let [k,l,t,reqOrOpts,req2]=f,required=reqOrOpts===1||req2===1,opts=typeof reqOrOpts==='string'?reqOrOpts.split('|'):[],v=rec[k]??(['date','joined','followup','paidOn'].includes(k)?today():'');let inp=t==='select'?`<select name="${k}" ${required?'required':''}><option value="">Select...</option>${opts.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:t==='textarea'?`<textarea name="${k}" rows="3">${esc(v)}</textarea>`:`<input name="${k}" type="${t}" value="${esc(v)}" ${required?'required':''} ${t==='number'?'min="0" step="0.01"':''}>`;return `<div class="${t==='textarea'?'full':''}"><label>${esc(l)}${required?' *':''}</label>${inp}</div>`}).join('');document.getElementById('modal').style.display='flex'}function closeForm(){document.getElementById('modal').style.display='none';editId=null;formType=''}
function saveForm(e){e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries()),arr=db[formType];if(formType==='members'&&!obj.memberId)obj.memberId='AGW-'+String(arr.length+1).padStart(4,'0');if(formType==='attendance'&&!obj.count)obj.count='1';if(editId){let i=arr.findIndex(x=>x.id===editId);if(i>=0)arr[i]={...arr[i],...obj}}else arr.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2),...obj});persist();closeForm();render()}
function deleteRecord(t,id){if(confirm('Permanently delete this record from this computer?')){db[t]=db[t].filter(x=>x.id!==id);persist();render()}}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}function exportCSV(t){if(!db[t].length)return alert('No records to export.');let keys=[...new Set(db[t].flatMap(Object.keys))],cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"',csv=[keys.map(cell).join(','),...db[t].map(x=>keys.map(k=>cell(x[k])).join(','))].join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),`AG-Wli-${t}-${today()}.csv`)}function backup(){download(new Blob([JSON.stringify({...db,backupVersion:1,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),`AG-Wli-Backup-${today()}.json`)}
function reports(){return `${head('Reports & Backup','Export your records or restore a saved backup.')}<div class="notice">Protect backup files because pastoral-care and payroll records may be confidential. Restoring replaces current data; export a backup first.</div><div class="cols"><div class="panel"><h3>Full backup</h3><p>Export all records and settings to a JSON file that can be kept on a USB drive.</p><button class="btn primary" onclick="backup()">Download full backup (.json)</button><p><button class="btn soft" onclick="document.getElementById('importFile').click()">Restore backup (.json)</button></p></div><div class="panel"><h3>Summary report</h3><div class="report">${esc(db.church.name)}\nDate: ${today()}\nMembers: ${db.members.length}\nAttendance entries: ${db.attendance.length}\nIncome: ${cash(income())}\nExpenses: ${cash(expenses())}\nBalance: ${cash(income()-expenses())}\nEvents: ${db.events.length}\nPastoral care records: ${db.pastoral.length}\nPayroll records: ${db.payroll.length}</div><p><button class="btn soft" onclick="print()">Print / Save as PDF</button></p></div></div><div class="panel" style="margin-top:15px"><h3>Export sections</h3><div class="quick">${Object.keys(schemas).map(k=>`<button onclick="exportCSV('${k}')">${schemas[k].title} CSV</button>`).join('')}</div></div>`}
function settings(){return `${head('Church settings','These details are saved locally on this computer.')}<div class="panel"><form id="settingsForm"><div class="fields"><div><label>Church name</label><input name="name" required value="${esc(db.church.name)}"></div><div><label>Currency</label><select name="currency"><option ${db.church.currency==='GHS'?'selected':''}>GHS</option><option ${db.church.currency==='USD'?'selected':''}>USD</option><option ${db.church.currency==='EUR'?'selected':''}>EUR</option><option ${db.church.currency==='GBP'?'selected':''}>GBP</option></select></div><div><label>Pastor / leader</label><input name="pastor" value="${esc(db.church.pastor)}"></div><div><label>Church phone</label><input name="phone" value="${esc(db.church.phone)}"></div><div class="full"><label>Address</label><input name="address" value="${esc(db.church.address)}"></div></div><div class="foot"><button class="btn primary">Save settings</button></div></form></div><div class="panel" style="margin-top:15px"><h3>Local data management</h3><p>Records are stored on this computer and do not sync with the online app. Back up before reinstalling Windows or moving to another computer.</p><button class="btn red" onclick="clearAll()">Delete all local data</button></div>`}
document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();db.church={...db.church,...Object.fromEntries(new FormData(e.target).entries())};persist();render();alert('Church settings saved.')}});async function importBackup(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.members)||!Array.isArray(x.finance))throw Error('This is not a valid church backup.');if(confirm('Replace all current local records with this backup?')){db={...structuredClone(defaults),...x};delete db.backupVersion;delete db.exportedAt;persist();render();alert('Backup restored successfully.')}}catch(err){alert('Could not restore backup: '+err.message)}finally{e.target.value=''}}function clearAll(){if(confirm('Delete ALL local church data? Make a backup first.'))if(confirm('Final confirmation: permanently delete everything?')){db=structuredClone(defaults);persist();render()}}

async function checkForUpdates(){const status=document.getElementById('updateStatus');if(!window.agWliUpdater){status.textContent='Update service is available in the installed desktop version.';return}status.textContent='Starting update check…';try{const r=await window.agWliUpdater.check();if(r.status==='development')status.textContent=r.message;else if(r.status==='error')status.textContent=r.message||'Could not check for updates.'}catch(e){status.textContent='Could not check for updates. You can continue offline.'}}
if(window.agWliUpdater){window.agWliUpdater.onStatus(async info=>{const el=document.getElementById('updateStatus');if(el)el.textContent=info.detail||info.status;if(info.status==='downloaded'){const yes=confirm(`${info.detail}\n\nInstall now? The app will create a local pre-update backup first.`);if(yes){try{const result=await window.agWliUpdater.install(localStorage.getItem(KEY)||'{}');if(result.status==='error')alert('Update was not installed: '+result.message)}catch(e){alert('Update was not installed: '+e.message)}}}})}
init();
</script></body></html>
